<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi RAF">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.png">
<link rel="manifest" href="/suivi/manifest.json">
<title>Suivi RAF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1f3a;--blue:#1e5cd8;--red:#d62839;--ink:#0f1b2d;--muted:#5a6880;--bg:#f2f5fa;--card:#fff;--line:#dde4ef;--ok:#15803d;--ok-bg:#dcf3e4;--warn:#b45309;--warn-bg:#fef3c7;--r:14px;
--sh:0 1px 2px rgba(10,31,58,.06),0 6px 18px rgba(10,31,58,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* barre du haut */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header img{height:28px}
header .t{font-weight:800;font-size:17px;flex:1}
header .who{font-size:13px;opacity:.8;background:none;border:0;color:#fff;padding:6px 0}
nav.tabs{position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:19;background:var(--navy);display:flex;padding:0 8px 8px;gap:6px}
nav.tabs button{flex:1;border:0;border-radius:10px;padding:10px 6px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:14px}
nav.tabs button.on{background:#fff;color:var(--navy)}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
/* connexion */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:var(--navy);color:#fff}
#login img{height:56px;margin-bottom:12px}
#login h1{font-size:22px;margin:0 0 4px}
#login p{margin:0 0 20px;opacity:.75}
.dots{display:flex;gap:12px;margin-bottom:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border-radius:16px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:700}
.pad button:active{background:rgba(255,255,255,.25)}
#loginErr{min-height:22px;color:#ffb4b4;margin-top:14px;font-weight:600}
/* filtres */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip b{font-weight:800;margin-left:4px}
.searchbox{position:sticky;top:calc(100px + env(safe-area-inset-top));z-index:15;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin-bottom:10px;box-shadow:var(--sh)}
.searchbox:focus-within{border-color:var(--blue)}
.searchbox input{flex:1;border:0;outline:0;padding:10px 0;font-size:16px;background:transparent;min-width:0}
.searchbox button{border:0;background:#eef0f3;border-radius:8px;width:32px;height:32px;font-size:14px}
.qinfo{font-size:13px;color:var(--muted);margin:-4px 0 8px 4px}
/* cartes lead */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.lead{display:block;width:100%;text-align:left;border:1px solid transparent;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.lead:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(10,31,58,.08),0 12px 28px rgba(10,31,58,.14);border-color:var(--blue)}
.lead:active{transform:translateY(0)}
.lead .nm{display:flex;align-items:center;gap:6px}
.lead .nm .go{margin-left:auto;color:var(--blue);font-size:22px;line-height:1;transition:transform .12s ease}
.lead:hover .nm .go{transform:translateX(3px)}
.lead:hover .nm .who{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.tbl tr[data-id]:hover td{background:#eef3fa}
.lead.new{border-left:5px solid var(--red)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:#e8eef9;color:var(--blue)}
.src.meta{background:#e9e5fb;color:#5b3fd1}.src.lsa{background:#e3f4ea;color:#14753a}.src.google_ads{background:#e8eef9;color:#1e5cd8}
.src.inconnu{background:var(--warn-bg);color:var(--warn)}.src.bouche_a_oreille,.src.fiche_google,.src.site,.src.autre{background:#eef0f3;color:#3d4a5c}
.when{font-size:13px;color:var(--muted);margin-left:auto}
.lead .nm{font-size:17px;font-weight:700;margin:6px 0 2px}
.lead .sub{color:var(--muted);font-size:14px}
.lead .resume{margin-top:6px;font-size:14px;line-height:1.35;color:var(--ink);background:#f6f8fc;border-radius:8px;padding:7px 9px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#eef0f3}
.pill.nouveau{background:#fde2e4;color:var(--red)}.pill.relancer{background:#ffedd5;color:#c2410c}.pill.rappele{background:#e8eef9;color:var(--blue)}.pill.devis{background:var(--warn-bg);color:var(--warn)}
.pill.planifie{background:#e9e5fb;color:#5b3fd1}.pill.termine{background:var(--ok-bg);color:var(--ok)}.pill.perdu,.pill.faux{background:#eef0f3;color:#6b7280}
.qa{display:flex;gap:8px;margin-top:10px}
.qa a{flex:1;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:10px;font-size:14px}
.call{background:var(--red);color:#fff}
.qa .nr{flex:none;width:48px;border:1px solid #fdba74;background:#fff7ed;border-radius:10px;font-size:18px}
.qa .nr:hover{background:#ffedd5}.wa{background:#e7f8ee;color:#128c4a}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* bouton + */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 24px rgba(214,40,57,.4);z-index:30}
/* fiche */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .top{position:sticky;top:0;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .top button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.sheet .top .t{flex:1;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .in{max-width:720px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.big-tel{font-size:22px;font-weight:800;margin:2px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font-weight:700;font-size:14px;text-align:center}
.opt.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.sm{padding:10px 6px;font-size:13px}
.opt.relance-btn{grid-column:1/-1;border-color:#fdba74;color:#c2410c}.opt.relance-btn.on{background:#c2410c;border-color:#c2410c;color:#fff}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dde4ef}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .add{border:2px dashed var(--line-strong,#b6c4d9);background:#fff;border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;color:var(--muted);font-size:13px;gap:4px}
.photos .add span{font-size:26px;line-height:1}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:3}
.save button{width:100%;max-width:688px;display:block;margin:0 auto;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:var(--ok);color:#fff;box-shadow:0 8px 20px rgba(21,128,61,.3)}
.hist{font-size:13px;color:var(--muted)}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.link-btn{display:block;width:100%;margin:10px 0 0;color:var(--blue)!important;border-style:dashed}
.picker .item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.picker .item:hover{border-color:var(--blue);background:#f5f8ff}
.picker .item b{display:block}
.btn2{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;color:#128c4a}
.calc{background:#f6f8fc;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
/* tableau de bord */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--navy);color:#fff}.kpi.hl .l,.kpi.hl .s{color:rgba(255,255,255,.75)}
.kpi.green .v{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:14px;max-width:90%}
.spin{opacity:.6;pointer-events:none}
</style>
</head>
<body>

<!-- Connexion -->
<section id="login" class="hide">
  <img src="/assets/raf-logo-blanc.png" alt="">
  <h1>Suivi des clients</h1>
  <p>Entre ton code puis OK</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="loginErr"></div>
</section>

<!-- Appli -->
<div id="app" class="hide">
  <header>
    <img src="/assets/raf-logo-blanc.png" alt="">
    <div class="t">Suivi</div>
    <button class="who" id="who"></button>
  </header>
  <nav class="tabs">
    <button data-tab="leads" class="on">Clients</button>
    <button data-tab="dash">Tableau de bord</button>
  </nav>
  <main>
    <section id="tab-leads">
      <div class="searchbox"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="Rechercher : nom, numéro, ville, besoin…" autocomplete="off"><button id="qclear" class="hide" aria-label="Effacer">✕</button></div>
      <div id="qinfo" class="qinfo hide"></div>
      <div class="chips" id="filters"></div>
      <div id="list"></div>
    </section>
    <section id="tab-dash" class="hide">
      <div class="chips" id="periods"></div>
      <div id="dash"></div>
    </section>
  </main>
  <button class="fab" id="add" aria-label="Ajouter un client">+</button>
</div>

<div id="sheet" class="sheet hide"></div>
<input type="file" id="file" accept="image/*" multiple class="hide">

<script>
(() => {
const API = '/api/suivi';
const REVIEW = 'https://g.page/r/Cd-3QXPqZL6kEBM/review';
const SRC = {lsa:'Google (LSA)',google_ads:'Google Ads',meta:'Facebook / Insta',site:'Site web',fiche_google:'Fiche Google',bouche_a_oreille:'Bouche-à-oreille',autre:'Autre',inconnu:'À préciser'};
const SRC_PICK = ['lsa','google_ads','meta','fiche_google','site','bouche_a_oreille','autre'];
const ST = {nouveau:'Nouveau',relancer:'À relancer',rappele:'Rappelé',devis:'Devis envoyé',planifie:'Intervention planifiée',termine:'Terminé',perdu:'Perdu',faux:'Faux lead'};
const ST_PICK = ['relancer','rappele','devis','planifie','termine','perdu','faux'];
const ST_BTN = {relancer:'📵 Pas répondu → à relancer',rappele:'✅ Eu au téléphone'};
const PLAT = {meta:'Meta (Facebook / Insta)',google_ads:'Google Ads',lsa:'Google LSA'};
const RATE = 0.25;
let S = {token:null,name:'',role:'',leads:[],filter:'todo',q:'',period:'month',cur:null,dirty:false};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (n==null||isNaN(n)?'—':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €');
const eur0 = n => (n==null||isNaN(n)?'—':Math.round(n).toLocaleString('fr-FR')+' €');
const fmtTel = t => (t||'').replace(/^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/,'$1 $2 $3 $4 $5');
const waTel = t => t ? '33'+String(t).replace(/^0/,'') : '';
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return"à l'instant";if(s<3600)return'il y a '+Math.floor(s/60)+' min';if(s<86400)return'il y a '+Math.floor(s/3600)+' h';
  const x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
const dt = d => d? new Date(d).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const ymd = d => {const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
function localInput(d){if(!d)return'';const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)}

async function call(action,data={}){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:S.token,...data})});
  const j = await r.json().catch(()=>({error:'Réseau'}));
  if(r.status===401 && action!=='login'){logout();throw new Error(j.error)}
  if(!r.ok) throw new Error(j.error||'Erreur');
  return j;
}

/* ---------- connexion ---------- */
let pin='';
function drawDots(){$('#dots').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<pin.length?'f':''}"></i>`).join('')}
function buildPad(){
  // codes de 4 à 6 chiffres : 6 chiffres = envoi automatique, sinon bouton OK
  const keys=['1','2','3','4','5','6','7','8','9','OK','0','⌫'];
  $('#pad').innerHTML=keys.map(k=>`<button data-k="${k}"${k==='OK'?' style="font-size:18px;background:#d62839"':''}>${k}</button>`).join('');
  $('#pad').onclick=async e=>{const k=e.target.dataset.k;if(!k)return;$('#loginErr').textContent='';
    if(k==='⌫')pin=pin.slice(0,-1);else if(k!=='OK'&&pin.length<6)pin+=k;drawDots();
    if(k==='OK'&&pin.length<4){$('#loginErr').textContent='Code trop court';return}
    if(pin.length===6||k==='OK'){try{const j=await call('login',{pin});S.token=j.token;S.name=j.name;S.role=j.role;store('raf_s',JSON.stringify({token:j.token,name:j.name,role:j.role}));start()}
      catch(err){$('#loginErr').textContent=err.message||'Code incorrect';pin='';drawDots()}}};
  drawDots();
}
function logout(){store('raf_s');S.token=null;$('#app').classList.add('hide');$('#sheet').classList.add('hide');$('#login').classList.remove('hide');pin='';drawDots()}

/* ---------- liste ---------- */
const FILTERS=[['todo','À traiter',l=>['nouveau','relancer','rappele','devis','planifie'].includes(l.statut)],['nouveau','Nouveaux',l=>l.statut==='nouveau'],['relancer','À relancer',l=>l.statut==='relancer'],
  ['planifie','Planifiés',l=>l.statut==='planifie'],['termine','Terminés',l=>l.statut==='termine'],['all','Tous',()=>true]];
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s.\-]/g,'');
function drawFilters(){$('#filters').innerHTML=FILTERS.map(([k,l,f])=>`<button class="chip ${S.filter===k?'on':''}" data-f="${k}">${l}<b>${S.leads.filter(f).length}</b></button>`).join('')}
function drawList(){
  drawFilters();
  const f=FILTERS.find(x=>x[0]===S.filter)[2];const q=norm(S.q);
  // une recherche cherche dans TOUS les clients, quel que soit le filtre
  let rows=q?S.leads.filter(l=>norm([l.nom,l.telephone,fmtTel(l.telephone),l.autres_tel,l.ville,l.besoin,SRC[l.source],ST[l.statut],l.note,l.message,resume(l)].join(' ')).includes(q)):S.leads.filter(f);
  $('#qinfo').classList.toggle('hide',!q);$('#qclear').classList.toggle('hide',!S.q);
  if(q)$('#qinfo').textContent=rows.length+' résultat'+(rows.length>1?'s':'')+' dans tous les clients';
  $('#filters').style.opacity=q?'.45':'1';
  if(S.filter==='relancer'&&!q)rows.sort((a,b)=>new Date(a.relance_at||a.created_at)-new Date(b.relance_at||b.created_at));
  if(S.filter==='planifie')rows.sort((a,b)=>new Date(a.rdv_at||0)-new Date(b.rdv_at||0));
  $('#list').innerHTML=rows.length?rows.map(l=>`
   <div class="card lead ${l.statut==='nouveau'?'new':''}" data-id="${l.id}">
     <div class="row"><span class="src ${l.source}">${SRC[l.source]||l.source}</span><span class="pill ${l.statut}">${ST[l.statut]}</span><span class="when">${ago(l.created_at)}</span></div>
     <div class="nm"><span class="who">${esc(l.nom||fmtTel(l.telephone)||'Sans numéro')}</span><span class="go" aria-hidden="true">›</span></div>
     <div class="sub">${esc([l.nom&&fmtTel(l.telephone),l.ville].filter(Boolean).join(' · '))}</div>
     <div class="resume">${esc(resume(l))}</div>
     ${l.statut==='relancer'?`<div class="sub" style="color:#c2410c;font-weight:700;margin-top:4px">📵 Pas répondu${l.nb_relances?' · '+l.nb_relances+' tentative'+(l.nb_relances>1?'s':''):''}${l.relance_at?' · rappeler '+dt(l.relance_at):''}</div>`:''}
     ${l.statut==='planifie'&&l.rdv_at?`<div class="sub" style="color:#5b3fd1;font-weight:700;margin-top:4px">📅 ${dt(l.rdv_at)}</div>`:''}
     ${l.statut==='termine'?`<div class="sub" style="margin-top:4px">${l.montant!=null?'💶 '+eur(l.montant):'⚠️ Montant à remplir'}${l.photos?' · 📷 '+l.photos:''} · ${l.avis_demande?'⭐ avis demandé':'avis pas demandé'}</div>`:''}

function resume(l){
  const t=String(l.lead_type||'').toLowerCase();
  const canal=t.includes('formulaire')?'Demande de devis':t.includes('message')?'Message':t.includes('phone')||t.includes('appel')?'Appel':'Client';
  const via={lsa:'via Google (LSA)',google_ads:'via une annonce Google',meta:'via Facebook / Insta',site:'via le site',fiche_google:'via la fiche Google',bouche_a_oreille:'par bouche-à-oreille',autre:'',inconnu:''}[l.source]||'';
  const head=[canal,via,l.ville?'à '+l.ville:''].filter(Boolean).join(' ');
  const quoi=l.besoin||'';
  const plus=(l.note||'').split(/\n|\. /)[0]||(l.message||'');
  let s=head+(quoi?' : '+quoi:'');
  if(plus&&!s.includes(plus))s+=(quoi?'. ':' — ')+plus;
  s=s.replace(/\s+/g,' ').trim();
  return s.length>140?s.slice(0,137)+'…':s;
}

/* photo : compressée dans le téléphone avant envoi */
function compress(file){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',.72))};img.onerror=ko;img.src=URL.createObjectURL(file)})}

function range(p){const n=new Date(),d=x=>ymd(x);const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='today')return[d(t),d(t)];if(p==='yesterday'){const y=new Date(t);y.setDate(y.getDate()-1);return[d(y),d(y)]}
  if(p==='7d'){const s=new Date(t);s.setDate(s.getDate()-6);return[d(s),d(t)]}if(p==='month')return[d(new Date(t.getFullYear(),t.getMonth(),1)),d(t)];
  if(p==='lastmonth')return[d(new Date(t.getFullYear(),t.getMonth()-1,1)),d(new Date(t.getFullYear(),t.getMonth(),0))];return['2020-01-01',d(t)]}

   <h3>Interventions</h3>
   <div class="card scroll"><table class="tbl"><thead><tr><th>Date</th><th>Client</th><th class="n">CA</th><th class="n">Frais</th><th class="n">Base</th><th class="n">Comm.</th></tr></thead><tbody>
   ${done.map(x=>`<tr data-id="${x.id}" style="cursor:pointer"><td>${new Date(x.termine_at||x.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</td><td>${esc(x.ville||x.nom||'—')}<br><span class="src ${x.source}" style="font-size:11px">${SRC[x.source]}</span></td><td class="n">${x.montant?eur0(x.montant):'⚠️'}</td><td class="n">${eur0(x.frais)}</td><td class="n">${eur0(x.montant-x.frais)}</td><td class="n">${eur(Math.max(0,(x.montant-x.frais))*RATE)}</td></tr>`).join('')}
   <tr class="tot"><td colspan="2">Total</td><td class="n">${eur0(CA)}</td><td class="n">${eur0(FR)}</td><td class="n">${eur0(BASE)}</td><td class="n">${eur(COM)}</td></tr>
   </tbody></table></div>

   <h3>Publicité par jour</h3>
   <div class="card scroll"><table class="tbl"><thead><tr><th>Jour</th><th class="n">Meta</th><th class="n">G. Ads</th><th class="n">LSA</th><th class="n">Total</th></tr></thead><tbody>
   ${(()=>{const by={};j.spend.forEach(s=>{const k=String(s.day).slice(0,10);(by[k]=by[k]||{meta:0,google_ads:0,lsa:0,est:false})[s.platform]+=s.amount;if(s.est)by[k].est=true});
     const ks=Object.keys(by).sort().reverse();return ks.map(k=>{const r=by[k];return`<tr><td>${new Date(k+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td class="n">${eur0(r.meta)}</td><td class="n">${eur0(r.google_ads)}</td><td class="n">${eur0(r.lsa)}${r.est?'*':''}</td><td class="n"><b>${eur0(r.meta+r.google_ads+r.lsa)}</b></td></tr>`}).join('')||'<tr><td colspan="5">Pas encore de dépense enregistrée</td></tr>'})()}
   </tbody></table><div class="note">Relevé automatique toutes les 3 heures (Meta, Google Ads, LSA). Les chiffres du jour peuvent encore bouger. * montant estimé.</div></div>

   ${S.role==='admin'?`<h3>Saisir une dépense pub (admin)</h3>
   <div class="card"><form id="spf"><div class="money"><div><label class="f">Jour</label><input class="inp" type="date" name="day" value="${ymd(new Date())}" required></div>
     <div><label class="f">Plateforme</label><select class="inp" name="platform">${Object.entries(PLAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
     <label class="f">Montant (€)</label><input class="inp" name="amount" inputmode="decimal" required>
     <button class="btn2" style="margin-top:10px;width:100%">Enregistrer la dépense</button></form>
     <div class="note">Remplace le montant déjà enregistré pour ce jour et cette plateforme. Le relevé automatique repasse sur les 3 derniers jours : saisis à la main surtout les jours plus anciens.</div></div>`:''}
  `;
  const f=$('#spf');if(f)f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));try{await call('spend_set',d);toast('Dépense enregistrée');drawDash()}catch(err){toast(err.message)}};
}

/* ---------- navigation ---------- */
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#tab-leads').classList.toggle('hide',b.dataset.tab!=='leads');$('#tab-dash').classList.toggle('hide',b.dataset.tab!=='dash');
  $('#add').classList.toggle('hide',b.dataset.tab!=='leads');
  if(b.dataset.tab==='dash')drawDash().catch(err=>toast(err.message));else drawList()};
$('#filters').onclick=e=>{const b=e.target.closest('[data-f]');if(b){S.filter=b.dataset.f;drawList()}};
$('#periods').onclick=e=>{const b=e.target.closest('[data-p]');if(b){S.period=b.dataset.p;drawDash().catch(err=>toast(err.message))}};
$('#q').oninput=e=>{S.q=e.target.value;drawList()};
$('#qclear').onclick=()=>{S.q='';$('#q').value='';drawList();$('#q').focus()};
$('#list').onclick=async e=>{const nr=e.target.closest('[data-nr]');
  if(nr){try{await call('update',{id:nr.dataset.nr,patch:{statut:'relancer'}});toast('Pas répondu : à relancer ✔');refresh()}catch(err){toast(err.message)}return}
  if(e.target.closest('a'))return;const c=e.target.closest('[data-id]');if(c)openLead(c.dataset.id).catch(err=>toast(err.message))};
$('#dash').onclick=e=>{const c=e.target.closest('tr[data-id]');if(c)openLead(c.dataset.id).catch(err=>toast(err.message))};
$('#add').onclick=openNew;
$('#who').onclick=()=>{if(confirm('Se déconnecter ?'))logout()};

function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=S.name+' · déconnexion';refresh()}
setInterval(()=>{if(S.token&&document.visibilityState==='visible'&&$('#sheet').classList.contains('hide'))refresh()},45000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.token)refresh()});

buildPad();
try{const s=JSON.parse(load('raf_s')||'null');if(s&&s.token){Object.assign(S,s);start()}else $('#login').classList.remove('hide')}catch(e){$('#login').classList.remove('hide')}
})();
</script>
</body>
</html>
